unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

setw -g mode-keys vi
set -sg escape-time 0

#bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

bind-key v copy-mode

bind -n S-Pageup copy-mode -u

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

unbind Left
unbind Down
unbind Up
unbind Right


set -g default-terminal "alacritty"
set -g base-index 1
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # colored underscores
set -as terminal-overrides ',alacritty:RGB' # true-color support

set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'seebi/tmux-colors-solarized'

#set -g @plugin 'tmux-plugins/tmux-open'
#set -g @plugin 'tmux-plugins/tmux-urlview'
#set -g @plugin 'christoomey/vim-tmux-navigator'

# DRACULA THEME
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "ssh-session"

set -g @dracula-show-network false
set -g @dracula-show-weather false
set -g @dracula-show-location false
set -g @dracula-fixed-location "Wheaton, IL"
set -g @dracula-show-timezone false
set -g @dracula-military-time true
set -g @dracula-show-left-icon  "Wolf"
set -g @dracula-git-disable-status false
set -g @dracula-git-show-diff-symbol +
set -g @dracula-git-show-current-symbol ""
set -g @dracula-git-no-repo-message "-"

set -g @dracula-show-powerline false
set -g @dracula-show-flags true
set -g @dracula-show-left-sep |
set -g @dracula-show-right-sep |

set -g @dracula-git-colors "pink dark_gray"

# SOLARIZED LIGHT THEME

#### COLOR (Solarized light)

