unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

setw -g mode-keys vi
set -sg escape-time 0
set-option -g allow-rename off
set -g focus-events on
set -g mouse on

#bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

bind-key v copy-mode

bind -n S-Pageup copy-mode -u

# Plain PageUp/PageDown scroll tmux's own scrollback (e.g. for Claude Code),
# but pass through untouched to apps with their own pager (vim, less, etc.)
bind-key -n PageUp if-shell -F "#{alternate_on}" "send-keys PageUp" "copy-mode -e ; send-keys -X page-up"
bind-key -n PageDown if-shell -F "#{alternate_on}" "send-keys PageDown" "send-keys -X page-down"

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# Navigate panes with Ctrl+hjkl, no prefix needed
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

bind e select-layout even-horizontal
bind J join-pane

bind c split-window -h -f -c "#{pane_current_path}"
bind n split-window -h -f -c "#{pane_current_path}"

unbind Left
unbind Down
unbind Up
unbind Right


set -g default-terminal "tmux"
set -g base-index 1
# set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # colored underscores

set -g @plugin 'tmux-plugins/tpm'
