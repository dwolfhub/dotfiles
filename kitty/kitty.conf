# Kitty Configuration
# Migrated from Alacritty configuration

# Font configuration
font_family      MonoLisa Regular
bold_font        MonoLisa Bold
italic_font      MonoLisa Italic
bold_italic_font MonoLisa Bold Italic
font_size        13.0

# Font offset (line height adjustment)
# In Kitty, adjust_line_height is similar to Alacritty's offset.y
adjust_line_height 10

# Window layout
initial_window_width  240c
initial_window_height 80c

# Window padding (all sides)
window_padding_width 10

# Window decorations (buttonless in Alacritty = hide_window_decorations titlebar-only)
hide_window_decorations yes

# Window title
# window_title Codez

# Allow terminal applications to change the window title
dynamic_background_opacity yes

# Background opacity
background_opacity 0.9

# macOS specific: Option key behavior (Both = option_as_alt: Both in Alacritty)
macos_option_as_alt both

# Key bindings
# Alt+Left/Right for word navigation (similar to Alacritty config)
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
map alt+tab select_tab

# Unmap ctrl-t to allow fzf ctrl-t to work
# map ctrl+t no_action

# Disable ligatures when cursor is on them (optional, Kitty feature)
disable_ligatures_in cursor

# Tab bar style (optional, Kitty-specific)
tab_bar_edge bottom
tab_bar_style powerline

# Performance tuning
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Mouse
copy_on_select no
strip_trailing_spaces smart

# Advanced
allow_remote_control no
listen_on none
update_check_interval 0

# Shell integration (optional)
shell_integration enabled
