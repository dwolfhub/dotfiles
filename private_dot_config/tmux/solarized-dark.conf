# Solarized Dark colors for tmux
set -g status-style "bg=#073642,fg=#839496"
set -g status-left-style "bg=#268bd2,fg=#002b36,bold"
set -g status-right-style "bg=#073642,fg=#839496"
set -g window-status-style "bg=#073642,fg=#586e75"
set -g window-status-current-style "bg=#002b36,fg=#859900,bold"
set -g window-status-activity-style "bg=#073642,fg=#cb4b16"
set -g pane-border-style "fg=#586e75"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#073642,fg=#93a1a1"
set -g message-command-style "bg=#073642,fg=#268bd2"
set -g mode-style "bg=#586e75,fg=#fdf6e3"
set -g display-panes-colour "#586e75"
set -g display-panes-active-colour "#d33682"
set -g clock-mode-colour "#268bd2"
