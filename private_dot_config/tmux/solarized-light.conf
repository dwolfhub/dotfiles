# Solarized Light colors for tmux
set -g status-style "bg=#eee8d5,fg=#657b83"
set -g status-left-style "bg=#268bd2,fg=#fdf6e3,bold"
set -g status-right-style "bg=#eee8d5,fg=#657b83"
set -g window-status-style "bg=#eee8d5,fg=#93a1a1"
set -g window-status-current-style "bg=#fdf6e3,fg=#859900,bold"
set -g window-status-activity-style "bg=#eee8d5,fg=#cb4b16"
set -g pane-border-style "fg=#93a1a1"
set -g pane-active-border-style "fg=#268bd2"
set -g message-style "bg=#eee8d5,fg=#586e75"
set -g message-command-style "bg=#eee8d5,fg=#268bd2"
set -g mode-style "bg=#657b83,fg=#fdf6e3"
set -g display-panes-colour "#93a1a1"
set -g display-panes-active-colour "#d33682"
set -g clock-mode-colour "#268bd2"
